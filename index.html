<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narendra Mahi | Azure DevOps Professional</title>
    <link rel="icon" href="my-photos.jpg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --accent: #7cfc00; --pink: #ff69b4; --dark: #1b5e20; }
        * { box-sizing: border-box; transition: 0.3s; }
        body, html { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; height: 100%; background: var(--pink); overflow-x: hidden; }

        /* 1-Inch Pink Borders with Floating Icons */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .icon { position: absolute; font-size: 35px; animation: floatUp 12s infinite linear; opacity: 1; filter: drop-shadow(0 0 5px rgba(0,0,0,0.2)); }
        
        /* Floating Icons Positions & Colors */
        .l1 { left: 15px; color: #2496ed; animation-delay: 0s; } .l2 { left: 25px; color: #326ce5; animation-delay: 2s; }
        .l3 { left: 10px; color: #844fba; animation-delay: 4s; } .l4 { left: 30px; color: #d71100; animation-delay: 6s; }
        .l5 { left: 20px; color: #f0ad4e; animation-delay: 8s; }
        .r1 { right: 15px; color: #0089d6; animation-delay: 1s; } .r2 { right: 25px; color: #f05032; animation-delay: 3s; }
        .r3 { right: 10px; color: #ffeb3b; animation-delay: 5s; } .r4 { right: 30px; color: #e5352c; animation-delay: 7s; }
        .r5 { right: 20px; color: #ff9900; animation-delay: 9s; }

        @keyframes floatUp { 
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } 
        }

        /* Container & Full Watermark */
        .master-container {
            position: relative; z-index: 10; width: 100%; min-height: 100vh;
            background: rgba(240, 255, 240, 0.94); border-left: 50px solid var(--pink); border-right: 50px solid var(--pink);
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }

        .watermark {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('my-photos.jpg') no-repeat center center/cover;
            opacity: 0.28; z-index: -1; pointer-events: none;
        }

        .header-section { text-align: center; margin-bottom: 30px; }
        .name-title { font-family: 'Orbitron', sans-serif; font-size: 80px; color: var(--dark); text-transform: uppercase; margin: 0; text-shadow: 4px 4px 0px var(--accent); }
        .sub-title { font-size: 24px; color: #222; background: white; padding: 10px 35px; border-radius: 50px; border: 3px solid var(--accent); display: inline-block; margin-top: 10px; font-weight: 700; }

        /* Left-Right Layout */
        .layout-wrapper { display: flex; width: 100%; max-width: 1400px; justify-content: space-between; align-items: center; gap: 20px; }
        .side-grid { display: flex; flex-direction: column; gap: 20px; width: 280px; }

        .action-btn { 
            text-decoration: none; padding: 25px 15px; border-radius: 15px; font-weight: 700; 
            font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; 
            color: white; border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        .action-btn:hover { transform: scale(1.1); filter: brightness(1.2); }

        /* Button Colors */
        .c1 { background: #4a148c; } .c2 { background: #d84315; } .c3 { background: #2e7d32; } .c4 { background: #01579b; } 
        .c5 { background: #0077b5; } .c6 { background: #37474f; } .c7 { background: #111; } .c8 { background: #1877f2; } 
        .c9 { background: #c2185b; } .c10 { background: #000; }

        /* Next/Back Music Player */
        .player-panel { width: 100%; max-width: 500px; background: #222; margin-top: 40px; padding: 25px; border-radius: 30px; border: 5px solid #ff4500; color: white; text-align: center; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin: 15px 0; }
        .ctrl-btn { background: none; border: none; color: white; font-size: 35px; cursor: pointer; }
        .ctrl-btn:hover { color: #ff4500; transform: scale(1.2); }
        .song-info { font-size: 14px; color: #bbb; margin-bottom: 10px; }

        @media (max-width: 900px) {
            .master-container { border: none; padding: 20px; }
            .bg-animation { display: none; }
            .layout-wrapper { flex-direction: column; }
            .side-grid { width: 100%; }
            .name-title { font-size: 45px; }
        }
    </style>
</head>
<body>

    <div class="bg-animation">
        <i class="fa-brands fa-docker icon l1"></i><i class="fa-solid fa-dharmachakra icon l2"></i>
        <i class="fa-solid fa-cloud-arrow-up icon l3"></i><i class="fa-brands fa-jenkins icon l4"></i><i class="fa-brands fa-linux icon l5"></i>
        <i class="fa-brands fa-microsoft icon r1"></i><i class="fa-brands fa-git-alt icon r2"></i>
        <i class="fa-solid fa-gear icon r3"></i><i class="fa-solid fa-chart-line icon r4"></i><i class="fa-solid fa-eye icon r5"></i>
    </div>

    <div class="master-container">
        <div class="watermark"></div>
        <div class="header-section">
            <h1 class="name-title">Narendra Mahi</h1>
            <div class="sub-title">Senior Azure DevOps & Cloud Master</div>
        </div>

        <div class="layout-wrapper">
            <div class="side-grid">
                <button onclick="openM('skillM')" class="action-btn c1"><i class="fa-solid fa-bolt"></i> Skills Hub</button>
                <a href="https://docs.google.com/document/d/1y_S0yvJLbMg9gJI0E1ywihi-xnvUm5f4/preview" target="_blank" class="action-btn c2">My Professional CV</a>
                <a href="https://docs.google.com/document/d/1WEdPSMDFmQRuQrCGI0HxmtnDRa-UGv5E/preview" target="_blank" class="action-btn c3">Learning Vault</a>
                <a href="https://docs.google.com/spreadsheets/d/19q3dKUqFktYcuLGcYiYfwmyT0oq8XfeH/preview" target="_blank" class="action-btn c4">Project Excel</a>
                <a href="https://www.linkedin.com/in/narendra-mahi" target="_blank" class="action-btn c5">LinkedIn Profile</a>
            </div>

            <div style="flex:1;"></div>

            <div class="side-grid">
                <a href="https://docs.google.com/document/d/15THFidXWhsN-yXp2LNOyU8imvCv8RHLY/preview" target="_blank" class="action-btn c6">Word Document</a>
                <a href="https://github.com/narendramahi007-cloud" target="_blank" class="action-btn c7">GitHub Repos</a>
                <a href="https://www.facebook.com/profile.php?id=100008720538562" target="_blank" class="action-btn c8">Facebook Page</a>
                <button onclick="openM('galM')" class="action-btn c9">50+ Gallery</button>
                <a href="mailto:Narendramahi007@gmail.com" class="action-btn c10">Contact Me</a>
            </div>
        </div>

        <div class="player-panel">
            <div class="song-info" id="songTitle">Narendra's Playlist - Song 1</div>
            <audio id="audioPlayer"></audio>
            <div class="controls">
                <button class="ctrl-btn" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-btn" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-circle-play"></i></button>
                <button class="ctrl-btn" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <p style="font-size:10px; color:#777;">(Secure View Only - No Download)</p>
        </div>
    </div>

    <div id="skillM" class="modal"><div class="modal-content"><span class="close-btn" onclick="closeM('skillM')">&times;</span><h1>Technical Skills Details...</h1></div></div>
    <div id="galM" class="modal"><div class="modal-content"><span class="close-btn" onclick="closeM('galM')">&times;</span><h1 style="text-align:center;">Project Gallery (50+ Slots)</h1><div id="photoGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:15px;"></div></div></div>

    <script>
        const songs = [
            "DRIVE_LINK_1", "DRIVE_LINK_2", "DRIVE_LINK_3" // Replace with direct player links
        ];
        let currentSong = 0;
        const player = document.getElementById('audioPlayer');

        function togglePlay() {
            if(player.paused) { player.play(); document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-circle-pause"></i>'; }
            else { player.pause(); document.getElementById('playBtn').innerHTML = '<i class="fa-solid fa-circle-play"></i>'; }
        }
        function nextSong() { currentSong = (currentSong + 1) % songs.length; loadSong(); }
        function prevSong() { currentSong = (currentSong - 1 + songs.length) % songs.length; loadSong(); }
        function loadSong() { player.src = songs[currentSong]; player.play(); document.getElementById('songTitle').innerText = "Playing Song " + (currentSong + 1); }

        function openM(id) { document.getElementById(id).style.display = "block"; if(id === 'galM') renderPhotos(); }
        function closeM(id) { document.getElementById(id).style.display = "none"; }
        function renderPhotos() {
            const grid = document.getElementById('photoGrid'); grid.innerHTML = "";
            for(let i=1; i<=50; i++) grid.innerHTML += `<div style="border:4px solid #ff69b4; border-radius:15px; height:300px; overflow:hidden;"><img src="photo${i}.jpg" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/300?text=Work+Photo+${i}'"></div>`;
        }
    </script>
</body>
</html>
