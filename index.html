<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Narendra Mahi | Azure DevSecOps Master</title>
    <link rel="icon" href="my-photos.jpg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=900&family=Poppins:wght=400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --accent: #7cfc00; --pink: #ff69b4; --dark: #1b5e20; }
        * { box-sizing: border-box; transition: 0.3s; }
        
        body, html { 
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif; height: 100%; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
        }

        .master-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240, 255, 240, 0.94); z-index: -2; }
        .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('my-photos.jpg') no-repeat center center/cover; opacity: 0.20; z-index: -1; pointer-events: none; }

        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .icon { position: absolute; font-size: 50px; animation: floatUp 15s infinite linear; opacity: 1; }
        .ic-docker { left: 15%; color: #2496ed; animation-delay: 0s; }
        .ic-k8s { left: 35%; color: #326ce5; animation-delay: 3s; }
        .ic-terraform { left: 55%; color: #844fba; animation-delay: 6s; }
        .ic-cicd { right: 35%; color: #2e7d32; animation-delay: 9s; }
        .ic-ms { right: 15%; color: #0089d6; animation-delay: 12s; }
        .ic-linux { right: 5%; color: #f0ad4e; animation-delay: 15s; }
        @keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

        .container { 
            position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .name-title { font-family: 'Orbitron', sans-serif; font-size: clamp(30px, 6vw, 70px); color: var(--dark); text-transform: uppercase; margin: 0; text-shadow: 3px 3px 0px var(--accent); text-align: center; }
        .sub-title { font-size: 20px; color: #fff; background: #000; padding: 10px 30px; border-radius: 50px; border: 3px solid var(--pink); margin-top: 15px; font-weight: 700; text-align: center; text-transform: uppercase; text-shadow: 2px 2px 0px var(--pink), -1px -1px 0px var(--pink); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        .edge-btn { position: absolute; width: 220px; text-decoration: none; padding: 20px; border-radius: 15px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; color: white; border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3); text-transform: uppercase; z-index: 20; }
        .edge-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-left-1 { left: 80px; top: 30%; background: #4a148c; }
        .btn-left-2 { left: 80px; top: 50%; background: #111; }
        .btn-left-3 { left: 80px; top: 70%; background: #e65100; }
        .btn-right-1 { right: 80px; top: 30%; background: #c2185b; }
        .btn-right-2 { right: 80px; top: 50%; background: #01579b; }
        .btn-right-3 { right: 80px; top: 70%; background: #00796b; }
        .btn-contact { bottom: 30px; background: #d84315; width: 180px; padding: 12px; font-size: 12px; }

        .modal { 
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); overflow-y: auto; padding: 20px; 
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y !important;
        }
        .modal-content { 
            background: #fff; margin: auto; padding: 40px; width: 95%; max-width: 1100px; 
            border-radius: 30px; position: relative; 
        }
        .close-btn { position: sticky; top: 0; float: right; font-size: 50px; color: #f00; cursor: pointer; z-index: 100; padding: 5px; }
        
        .skill-header { background: #f9f9f9; border-left: 10px solid #4a148c; padding: 20px; margin-bottom: 20px; border-radius: 10px; text-align: left; }
        .sub-btn { background: #333; color: white; padding: 12px; border-radius: 10px; font-size: 13px; text-decoration: none; text-align: center; font-weight: 600; cursor: pointer; border: none; }

        .fullscreen-app-viewer {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #fff; z-index: 9999; overflow: hidden;
            touch-action: none !important;
        }
        .fullscreen-app-viewer iframe { width: 100%; height: 100%; border: none; margin: 0; padding: 0; }
        
        .app-back-trigger {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; 
            background: #ff0000; color: #fff; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 24px; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10000; border: 2px solid #fff;
        }

        .audio-item { background: #f0f0f0; margin: 10px 0; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 15px; }
        .audio-item span { flex-grow: 1; font-weight: 600; color: #333; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        audio { height: 35px; border-radius: 5px; width: 150px; }
        
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .photo-card { border: 3px solid #ec4899; border-radius: 15px; overflow: hidden; height: 250px; background: #eee; }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }

        .gk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }

        @media (max-width: 1000px) {
            .edge-btn { position: relative; left: 0; right: 0; top: 0; bottom: 0; margin: 10px auto; width: 90%; }
            .container { justify-content: flex-start; padding-top: 50px; overflow-y: auto; }
            audio { width: 120px; }
        }
    </style>
</head>
<body>

    <div class="master-bg"></div>
    <div class="watermark"></div>

    <div class="bg-animation">
        <i class="fa-brands fa-docker icon ic-docker"></i>
        <i class="fa-solid fa-dharmachakra icon ic-k8s"></i>
        <i class="fa-solid fa-code icon ic-terraform"></i>
        <i class="fa-solid fa-infinity icon ic-cicd"></i>
        <i class="fa-brands fa-microsoft icon ic-ms"></i>
        <i class="fa-brands fa-linux icon ic-linux"></i>
    </div>

    <div class="container" id="mainHomeUI">
        <h1 class="name-title">Narendra Mahi</h1>
        <div class="sub-title">Azure DevSecOps & Cloud Automation Engineer</div>

        <button onclick="openM('skillM')" class="edge-btn btn-left-1"><i class="fa-solid fa-brain"></i> Technical Skills</button>
        <a href="https://github.com/narendramahi007-cloud" target="_blank" class="edge-btn btn-left-2"><i class="fa-brands fa-github"></i> GitHub Actions</a>
        
        <button onclick="openM('gkM')" class="edge-btn btn-left-3"><i class="fa-solid fa-book-open"></i> General Knowledge</button>

        <button onclick="openM('entM')" class="edge-btn btn-right-1"><i class="fa-solid fa-clapperboard"></i> Entertainment</button>
        <button onclick="openM('socialM')" class="edge-btn btn-right-2"><i class="fa-solid fa-share-nodes"></i> Social Media</button>
        
        <button onclick="launchAppFile('networking.pdf', 'pdf')" class="edge-btn btn-right-3"><i class="fa-solid fa-network-wired"></i> Networking PDF</button>

        <a href="mailto:Narendramahi007@gmail.com" class="edge-btn btn-contact"><i class="fa-solid fa-envelope"></i> Contact Me</a>
    </div>

    <div id="appFullscreenViewer" class="fullscreen-app-viewer">
        <div class="app-back-trigger" onclick="closeAppFile()"><i class="fa-solid fa-arrow-left"></i></div>
        <div id="appViewerFrameWrapper" style="width:100%; height:100%;"></div>
    </div>

    <div id="skillM" class="modal"><div class="modal-content">
        <span class="close-btn" onclick="closeM('skillM')">&times;</span>
        <h2 style="text-align:center; color:#4a148c; font-family:'Orbitron';">Technical Hub</h2>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-bottom:30px;">
            <button onclick="launchAppFile('Narendra-CV.docx', 'doc')" class="sub-btn">Professional CV</button>
            <button onclick="launchAppFile('Learning-Data.docx', 'doc')" class="sub-btn">Learning Vault</button>
            <button onclick="launchAppFile('project.xlsx', 'excel')" class="sub-btn">Project Excel</button>
            <button onclick="launchAppFile('Project-Details.docx', 'doc')" class="sub-btn">Project Word</button>
        </div>
        <!-- Skill content remains unchanged -->
    </div></div>

    <div id="gkM" class="modal"><div class="modal-content">
        <span class="close-btn" onclick="closeM('gkM')">&times;</span>
        <h2 style="text-align:center; color:#e65100; font-family:'Orbitron';">GK Library</h2>
        <div class="gk-grid">
            <button onclick="launchAppFile('https://drive.google.com/file/d/1ZDaToifCyj7dE_I6nSvLe_LgA-6JYAYG/preview', 'drive')" class="sub-btn" style="background:#8d6e63;">1. Indian History</button>
            <button onclick="launchAppFile('https://drive.google.com/file/d/1fYz4mj4h0GZoPeARCFVMdhcUoM74qTCp/preview', 'drive')" class="sub-btn" style="background:#1e88e5;">2. Geography</button>
            <button onclick="launchAppFile('https://drive.google.com/file/d/1391ZXxtIfgbKVxHUWZ-A4ZGusChc3HZg/preview', 'drive')" class="sub-btn" style="background:#43a047;">3. Science & Tech</button>
            <button onclick="launchAppFile('https://drive.google.com/file/d/14EoiD_tFnKLADYE6pwMVMvmCusurr5Zv/preview', 'drive')" class="sub-btn" style="background:#fb8c00;">4. Constitution</button>
        </div>
    </div></div>

    <div id="socialM" class="modal"><div class="modal-content">
        <span class="close-btn" onclick="closeM('socialM')">&times;</span>
        <h2 style="text-align:center;">Connect with Me</h2>
        <div style="display:flex; flex-direction:column; gap:15px;">
            <a href="https://www.linkedin.com/in/narendra-mahi" target="_blank" rel="noopener noreferrer" class="edge-btn" style="position:static; width:100%; background:#0077b5;"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
            <a href="https://www.facebook.com/profile.php?id=100008720538562" target="_blank" rel="noopener noreferrer" class="edge-btn" style="position:static; width:100%; background:#1877f2;"><i class="fa-brands fa-facebook"></i> Facebook</a>
        </div>
    </div></div>

    <div id="entM" class="modal"><div class="modal-content">
        <span class="close-btn" onclick="closeM('entM')">&times;</span>
        <h2 style="text-align:center; color:#c2185b;">Entertainment Hub</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:20px;">
            <button onclick="showEnt('music-box')" class="sub-btn" style="background:#ff4500;">Music</button>
            <button onclick="showEnt('reels-box')" class="sub-btn" style="background:#8e44ad;">Reels</button>
            <button onclick="showEnt('photo-box')" class="sub-btn" style="background:#ec4899;">Images</button>
        </div>
        <div id="music-box" style="display:none; max-height: 500px; overflow-y: auto;"><div id="music-list"></div></div>
        <div id="reels-box" style="display:none; max-height: 500px; overflow-y: auto;"><div id="reels-list"></div></div>
        <div id="photo-box" style="display:none; max-height: 500px; overflow-y: auto;"><div class="photo-grid" id="pGrid"></div></div>
    </div></div>

    <script>
        const GITHUB_BASE = "https://raw.githubusercontent.com/narendramahi007-cloud/my-media/main/";
        let appHistoryTracker = [];

        function openM(id) { 
            document.getElementById(id).style.display = "block"; 
            if (!appHistoryTracker.includes(id)) {
                appHistoryTracker.push(id);
                window.history.pushState({viewId: id}, "");
            }
        }
        
        function closeM(id) { 
            document.getElementById(id).style.display = "none"; 
            appHistoryTracker = appHistoryTracker.filter(item => item !== id);
        }

        function launchAppFile(filePath, fileType) {
            const rootDomainPath = window.location.origin + window.location.pathname;
            const computedFileUrl = filePath.startsWith('http') ? filePath : (rootDomainPath.substring(0, rootDomainPath.lastIndexOf("/") + 1) + filePath);
            let finalEmbedUrl = "";
            if (fileType === 'doc' || fileType === 'pdf') {
                finalEmbedUrl = "https://docs.google.com/gview?url=" + encodeURIComponent(computedFileUrl) + "&embedded=true";
            } else if (fileType === 'excel') {
                finalEmbedUrl = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(computedFileUrl);
            } else if (fileType === 'drive') {
                finalEmbedUrl = computedFileUrl;
            }
            const frameContainer = document.getElementById('appViewerFrameWrapper');
            frameContainer.innerHTML = `<iframe src="${finalEmbedUrl}" allow="autoplay"></iframe>`;
            const viewerContainer = document.getElementById('appFullscreenViewer');
            viewerContainer.style.display = "block";
            if (!appHistoryTracker.includes('appFullscreenViewer')) {
                appHistoryTracker.push('appFullscreenViewer');
                window.history.pushState({viewId: 'appFullscreenViewer'}, "");
            }
        }

        function closeAppFile() {
            document.getElementById('appFullscreenViewer').style.display = "none";
            document.getElementById('appViewerFrameWrapper').innerHTML = "";
            appHistoryTracker = appHistoryTracker.filter(item => item !== 'appFullscreenViewer');
        }

        window.addEventListener('popstate', function(event) {
            if (appHistoryTracker.length > 0) {
                let activelyOpenView = appHistoryTracker.pop();
                if (activelyOpenView === 'appFullscreenViewer') {
                    document.getElementById('appFullscreenViewer').style.display = "none";
                    document.getElementById('appViewerFrameWrapper').innerHTML = "";
                } else {
                    document.getElementById(activelyOpenView).style.display = "none";
                }
                window.history.pushState(null, null, window.location.pathname);
            }
        });
        window.history.pushState(null, null, window.location.pathname);

        function showEnt(id) {
            ['music-box', 'reels-box', 'photo-box'].forEach(b => document.getElementById(b).style.display = "none");
            document.getElementById(id).style.display = "block";

            if(id === 'reels-box' && document.getElementById('reels-list').innerHTML === "") {
                const r = document.getElementById('reels-list');
                fetch("https://api.github.com/repos/narendramahi007-cloud/Reels-Shows/contents/")
                .then(res => res.json())
                .then(data => {
                    data.forEach(file => {
                        if(file.name.endsWith('.mp4')) {
                            r.innerHTML += `<div class="audio-item" style="flex-direction:column; align-items:flex-start;"><span style="font-size:14px; margin-bottom:5px;">${file.name.replace('.mp4', '')}</span><video controls style="width:100%; border-radius:10px;"><source src="${file.download_url}" type="video/mp4"></video></div>`;
                        }
                    });
                });
            }

            if(id === 'photo-box' && document.getElementById('pGrid').innerHTML === "") {
                const g = document.getElementById('pGrid');
                const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('');
                alphabet.forEach(char => {
                    g.innerHTML += `<div class="photo-card"><img src="${GITHUB_BASE}images/${char}.jpg" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;
                });
            }

            if(id === 'music-box' && document.getElementById('music-list').innerHTML === "") {
                const m = document.getElementById('music-list');
                fetch("https://api.github.com/repos/narendramahi007-cloud/my-media/contents/music")
                .then(res => res.json())
                .then(data => {
                    data.forEach(file => {
                        if(file.name.endsWith('.mp3')) {
                            m.innerHTML += `<div class="audio-item"><i class="fa-solid fa-play-circle" style="color:#ff4500; font-size:20px;"></i><span>${file.name.replace('.mp3', '').replaceAll('_', ' ')}</span><audio controls preload="none" onplay="stopOtherMusic(this)"><source src="${file.download_url}" type="audio/mpeg"></audio></div>`;
                        }
                    });
                });
            }
        }

        function stopOtherMusic(currentPlayingAudio) {
            document.querySelectorAll('audio').forEach(a => { if(a !== currentPlayingAudio) { a.pause(); a.currentTime = 0; } });
        }

        window.onclick = function(e) { if(e.target.className === "modal") { closeM(e.target.id); } }
    </script>
</body>
</html>
