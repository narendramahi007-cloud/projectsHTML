<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narendra Mahi | Azure DevOps Professional</title>
    <link rel="icon" href="my-photos.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="my-photos.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 1. LAYOUT & SIDE BORDERS */
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; height: 100%; overflow-x: hidden; }
        
        body { 
            background: #ff69b4; /* Side Pink Border */
            display: flex; 
            justify-content: center; 
            padding: 0 80px; /* 1-inch border effect */
        }

        /* 2. COLORFUL FLOATING ICONS */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .icon { position: absolute; font-size: 45px; animation: floatUp 12s infinite linear; opacity: 0.9; }
        .ic1 { left: 20px; color: #2496ed; animation-delay: 0s; } /* Docker */
        .ic2 { right: 20px; color: #0089d6; animation-delay: 2s; } /* Azure */
        .ic3 { left: 25px; color: #844fba; animation-delay: 4s; } /* Terraform */
        .ic4 { right: 25px; color: #f05032; animation-delay: 6s; } /* Git */
        .ic5 { left: 30px; color: #ffeb3b; animation-delay: 8s; } /* Linux */

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* 3. MAIN CONTAINER & WATERMARK */
        .container { 
            position: relative; z-index: 10; width: 100%; min-height: 100vh;
            background: rgba(240, 255, 240, 0.94); /* Green page */
            border-left: 10px solid #7cfc00; border-right: 10px solid #7cfc00;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 20px;
        }

        .watermark {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('my-photos.jpg') no-repeat center center/cover;
            opacity: 0.20; /* Shadow photo effect */
            z-index: -1; pointer-events: none;
        }

        .name-title { font-size: 75px; color: #1b5e20; font-weight: 900; margin: 0; text-shadow: 2px 2px 10px rgba(255,255,255,0.8); }
        .sub-title { font-size: 26px; color: #333; background: white; padding: 10px 30px; border-radius: 50px; border: 2px solid #7cfc00; margin-bottom: 50px; }

        /* 4. BUTTONS GRID */
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 95%; max-width: 1100px; }
        .action-btn { 
            text-decoration: none; padding: 22px 10px; border-radius: 15px; font-weight: 700; 
            font-size: 14px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; 
            color: white; border: none; cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }
        
        /* 10 Distinct Colors */
        .b1 { background: #4a148c; } .b2 { background: #d84315; } .b3 { background: #2e7d32; } .b4 { background: #01579b; } 
        .b5 { background: #0077b5; } .b6 { background: #37474f; } .b7 { background: #111111; } .b8 { background: #1877f2; } 
        .b9 { background: #c2185b; } .b10 { background: #000000; }
        .action-btn:hover { transform: translateY(-5px); filter: brightness(1.1); }

        /* 5. MODAL FOR GALLERY */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; padding: 40px; }
        .modal-content { background: #fff; margin: auto; padding: 40px; width: 95%; max-width: 1200px; border-radius: 30px; }
        .close-btn { position: sticky; top: 0; float: right; font-size: 50px; color: #f00; cursor: pointer; }
        
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .photo-item { border-radius: 10px; overflow: hidden; border: 4px solid #ff69b4; height: 300px; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="bg-animation">
        <i class="fa-brands fa-docker icon ic1"></i>
        <i class="fa-brands fa-microsoft icon ic2"></i>
        <i class="fa-solid fa-code-merge icon ic3"></i>
        <i class="fa-brands fa-github icon ic4"></i>
        <i class="fa-brands fa-linux icon ic5"></i>
    </div>

    <div class="container">
        <div class="watermark"></div>
        <h1 class="name-title">Narendra Mahi</h1>
        <p class="sub-title">Infrastructure Deployment Master | Azure DevOps Master Engineer</p>
        
        <div class="btn-grid">
            <button onclick="alert('Technical Skills are detailed in the Professional CV!')" class="action-btn b1"><i class="fa-solid fa-bolt"></i> 1. Skills</button>
            <a href="Narendra-CV.docx" target="_blank" class="action-btn b2"><i class="fa-solid fa-file-invoice"></i> 2. Professional CV</a>
            <a href="Learning-Data.docx" target="_blank" class="action-btn b3"><i class="fa-solid fa-book"></i> 3. Learning Data</a>
            <a href="https://docs.google.com/spreadsheets/d/19q3dKUqFktYcuLGcYiYfwmyT0oq8XfeH/edit?usp=sharing" target="_blank" class="action-btn b4"><i class="fa-solid fa-table"></i> 4. Excel Sheet</a>
            <a href="https://www.linkedin.com/in/narendra-mahi" target="_blank" class="action-btn b5"><i class="fa-brands fa-linkedin"></i> 5. LinkedIn</a>
            <a href="Project-Details.docx" target="_blank" class="action-btn b6"><i class="fa-solid fa-file-word"></i> 6. Word File</a>
            <a href="https://github.com/narendramahi007-cloud" target="_blank" class="action-btn b7"><i class="fa-brands fa-github"></i> 7. GitHub</a>
            <a href="https://www.facebook.com/profile.php?id=100008720538562" target="_blank" class="action-btn b8"><i class="fa-brands fa-facebook"></i> 8. Facebook</a>
            <button onclick="openM('galM')" class="action-btn b9"><i class="fa-solid fa-image"></i> 9. 50+ Gallery</button>
            <a href="mailto:Narendramahi007@gmail.com" class="action-btn b10"><i class="fa-solid fa-envelope"></i> 10. Contact Me</a>
        </div>
    </div>

    <div id="galM" class="modal"><div class="modal-content">
        <span class="close-btn" onclick="closeM('galM')">&times;</span>
        <h1 style="color:#c2185b; text-align:center; border-bottom:4px solid #ff69b4; padding-bottom:10px;">Master Project Gallery</h1>
        <div class="photo-grid">
            <script>
                // यह स्क्रिप्ट ऑटोमैटिकली 50 फोटो की जगह बना देगी
                for(let i=1; i<=50; i++) {
                    document.write(`<div class="photo-item"><img src="photo${i}.jpg" onerror="this.src='https://via.placeholder.com/300x350?text=Upload+Photo+${i}'"></div>`);
                }
            </script>
        </div>
    </div></div>

    <script>
        function openM(id) { document.getElementById(id).style.display = "block"; }
        function closeM(id) { document.getElementById(id).style.display = "none"; }
        window.onclick = function(e) { if(e.target.className === "modal") e.target.style.display = "none"; }
    </script>
</body>
</html>
